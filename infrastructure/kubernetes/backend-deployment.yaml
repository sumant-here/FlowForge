apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-backend
  namespace: flowforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowforge-backend
  template:
    metadata:
      labels:
        app: flowforge-backend
    spec:
      containers:
        - name: backend
          image: flowforge/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: flowforge-config
            - secretRef:
                name: flowforge-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-backend-service
  namespace: flowforge
spec:
  selector:
    app: flowforge-backend
  ports:
    - port: 8000
      targetPort: 8000
